name: Build APK

# Builds the launcher APK for the home TV and attaches it as a downloadable artifact.
# Run it by hand: Actions tab -> Build APK -> Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platforms;android-34 build-tools;34.0.0
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Use the same signing key every build (so updates install over the old version)
        run: |
          mkdir -p ~/.android
          cp launcher/ci-debug.keystore ~/.android/debug.keystore
      - name: Build release APK
        working-directory: launcher
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: cleanyourtv-launcher-apk
          path: launcher/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
      - name: Publish the APK as a Release (Code page -> Releases, right side)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" \
            launcher/app/build/outputs/apk/release/app-release.apk \
            --repo "${{ github.repository }}" \
            --title "Giao dien TV - ban build ${{ github.run_number }}" \
            --notes "APK cho TV Xiaomi MiTV-MOOQ0. Tai file app-release.apk ben duoi."
